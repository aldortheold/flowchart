    <path id="lip" d="M 0 40 C -30.3 28 -52.52 -24.84 -42.42 -62.1 C -78.78 -78.66 -98.98 -120.06 -68.68 -144.9 C -52.52 -190.44 -18.18 -207 0 -173.88 C 18.18 -207 52.52 -190.44 68.68 -144.9 C 98.98 -120.06 78.78 -78.66 42.42 -62.1 C 52.52 -24.84 30.3 28 0 40 Z"/>
