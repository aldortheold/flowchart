      <use href="#broad-petal" xlink:href="#broad-petal" x="256" y="256" fill="#dc9bd8" transform="rotate(290 256 256)"/>
      <use href="#lip" xlink:href="#lip" x="256" y="256" fill="#763f86" transform="rotate(180 256 256)"/>
