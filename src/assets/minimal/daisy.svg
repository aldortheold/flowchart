<svg xmlns="http://www.w3.org/2000/svg"
     data-asset-version="4"
     viewBox="0 0 512 512"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Minimal daisy</title>
  <desc id="desc">A directly overhead flat-color daisy with eight petals and a simple center.</desc>

  <defs>
    <path id="petal"
          d="M256 229 C224 192 226 120 256 72 C286 120 288 192 256 229 Z"/>
  </defs>

  <g id="bloom" fill="#fff3cf">
    <use href="#petal" transform="rotate(0 256 256)"/>
    <use href="#petal" transform="rotate(45 256 256)"/>
    <use href="#petal" transform="rotate(90 256 256)"/>
    <use href="#petal" transform="rotate(135 256 256)"/>
    <use href="#petal" transform="rotate(180 256 256)"/>
    <use href="#petal" transform="rotate(225 256 256)"/>
    <use href="#petal" transform="rotate(270 256 256)"/>
    <use href="#petal" transform="rotate(315 256 256)"/>
    <circle cx="256" cy="256" r="78" fill="#e7a52e"/>
    <circle cx="238" cy="232" r="30" fill="#f6ca50"/>
  </g>
</svg>
