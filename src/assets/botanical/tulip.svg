<svg xmlns="http://www.w3.org/2000/svg"
     data-asset-version="4"
     viewBox="0 0 512 512"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Botanical tulip</title>
  <desc id="desc">A directly overhead botanical tulip with layered pointed petals, fine ribs, and visible stamens.</desc>

  <defs>
    <path id="outer-petal"
          d="M256 268 C211 221 211 126 256 52 C301 126 301 221 256 268 Z"/>
    <path id="inner-petal"
          d="M256 276 C227 238 230 166 256 111 C284 166 283 238 256 276 Z"/>
    <path id="petal-rib"
          d="M256 244 C248 188 251 116 256 70"/>
  </defs>

  <g id="outer-petals" stroke="#a82d4c" stroke-width="4" stroke-linejoin="round">
    <use href="#outer-petal" fill="#ef5a67" transform="rotate(0 256 256)"/>
    <use href="#outer-petal" fill="#cf3858" transform="rotate(60 256 256)"/>
    <use href="#outer-petal" fill="#e94e62" transform="rotate(120 256 256)"/>
    <use href="#outer-petal" fill="#c83252" transform="rotate(180 256 256)"/>
    <use href="#outer-petal" fill="#ed5867" transform="rotate(240 256 256)"/>
    <use href="#outer-petal" fill="#d43b59" transform="rotate(300 256 256)"/>
  </g>

  <g id="outer-ribs" fill="none" stroke="#ff9b91" stroke-width="6" stroke-linecap="round" opacity="0.72">
    <use href="#petal-rib" transform="rotate(0 256 256)"/>
    <use href="#petal-rib" transform="rotate(60 256 256)"/>
    <use href="#petal-rib" transform="rotate(120 256 256)"/>
    <use href="#petal-rib" transform="rotate(180 256 256)"/>
    <use href="#petal-rib" transform="rotate(240 256 256)"/>
    <use href="#petal-rib" transform="rotate(300 256 256)"/>
  </g>

  <g id="inner-petals" stroke="#9d2747" stroke-width="3" stroke-linejoin="round">
    <use href="#inner-petal" fill="#ff7b75" transform="rotate(30 256 256)"/>
    <use href="#inner-petal" fill="#e64a60" transform="rotate(90 256 256)"/>
    <use href="#inner-petal" fill="#f66a6d" transform="rotate(150 256 256)"/>
    <use href="#inner-petal" fill="#d63a58" transform="rotate(210 256 256)"/>
    <use href="#inner-petal" fill="#fa716f" transform="rotate(270 256 256)"/>
    <use href="#inner-petal" fill="#df425c" transform="rotate(330 256 256)"/>
  </g>

  <circle cx="256" cy="256" r="56" fill="#8e2241"/>
  <circle cx="256" cy="256" r="32" fill="#5f1934"/>

  <g id="stamens" fill="#f2b83d">
    <ellipse cx="256" cy="219" rx="8" ry="15"/>
    <ellipse cx="256" cy="219" rx="8" ry="15" transform="rotate(60 256 256)"/>
    <ellipse cx="256" cy="219" rx="8" ry="15" transform="rotate(120 256 256)"/>
    <ellipse cx="256" cy="219" rx="8" ry="15" transform="rotate(180 256 256)"/>
    <ellipse cx="256" cy="219" rx="8" ry="15" transform="rotate(240 256 256)"/>
    <ellipse cx="256" cy="219" rx="8" ry="15" transform="rotate(300 256 256)"/>
  </g>
  <circle cx="256" cy="256" r="13" fill="#f6d064"/>
</svg>
