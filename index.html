<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/updated-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create flower wallpapers from 75 editable vector blooms, then export your composition as JPG, PNG, or SVG." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Flowchart — Flower wallpaper studio" />
    <meta property="og:description" content="Compose a flower wallpaper, tune every petal, and export it at exactly the size you need." />
    <meta name="twitter:card" content="summary" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f5ef" />
    <script>
      (() => {
        const key = "flowchart-theme"
        let mode = "system"

        try {
          const saved = localStorage.getItem(key)
          if (saved === "light" || saved === "dark" || saved === "system") mode = saved
        } catch {
          // Continue with the operating-system preference when storage is unavailable.
        }

        const dark = matchMedia("(prefers-color-scheme: dark)").matches
        const theme = mode === "system" ? (dark ? "dark" : "light") : mode
        const root = document.documentElement
        root.dataset.theme = theme
        root.dataset.themeMode = mode
        root.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#111713" : "#f6f5ef"
      })()
    </script>
    <title>Flowchart — Flower wallpaper studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
